[project]
name = "timeseries-data-agent"
version = "0.1.0"
description = "Time-Series Analytics Chatbot"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
tsda = "tsda.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
